<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaartquiz Aardrijkskunde</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#63708a; --line:#dde3ef;
  --accent:#2f6fed; --accent-2:#1f4fb8; --ok:#1f9d55; --ok-bg:#e3f6ea; --bad:#d63b3b; --bad-bg:#fde8e8; --hl:#f59e0b;
  --sea:#cfe4f5; --land:#eef0e6; --home:#fbfaf0; --border:#a9b0a0; --itemland:#e2e8d2; --itemhover:#f3e6a8;
  --river:#2477d4; --road:#d9480f; --dot:#7c3aed; --mt:rgba(166,112,58,.5); --mtline:#8a5a2b;
  --okfill:#8fdca8; --badfill:#f5a3a3; --hlfill:#fcd46b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1420; --card:#181f30; --text:#e8ecf6; --muted:#95a0ba; --line:#2a3452;
    --accent:#5b8dff; --accent-2:#8aa9ff; --ok:#3ecf7e; --ok-bg:#12301f; --bad:#ff6b6b; --bad-bg:#3a1a1e; --hl:#fbbf24;
    --sea:#12253a; --land:#26303a; --home:#2f3b46; --border:#4a5563; --itemland:#33423a; --itemhover:#5a5a2c;
    --river:#5aa9ff; --road:#ff8a4c; --dot:#b794f6; --mt:rgba(196,140,80,.5); --mtline:#c48c50;
    --okfill:#1f6b3f; --badfill:#7a2a2a; --hlfill:#7a5a10}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:16px;min-height:100%}
#app.playing{padding:8px 12px;height:100dvh;display:flex;flex-direction:column}
h1{font-size:1.6rem;margin:8px 0 4px} h2{font-size:1.25rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.cat{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.cat:hover,.cat:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.cat .ico{font-size:1.9rem}.cat b{display:block;margin-top:4px}.cat small{color:var(--muted);display:block}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--ok);width:0}
.meta{font-size:.82rem;color:var(--muted);margin-top:4px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.seg button{font:inherit;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.label{font-weight:600;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prompt{padding:6px 4px;font-size:1.25rem;font-weight:700;text-align:center;min-height:2.6rem}
.prompt small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mapwrap{position:relative;flex:1;min-height:280px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer}
.bottom{padding-top:8px;min-height:64px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--text)}
input[type=text]{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.fb{padding:10px 12px;border-radius:10px;margin-bottom:8px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb small{display:block;color:var(--muted)}
.hint{color:var(--muted);text-align:center;padding:8px}
.score{font-size:3rem;font-weight:700;color:var(--accent)}.center{text-align:center}
.list{list-style:none;padding:0;margin:8px 0 0}.list li{padding:8px 0;border-top:1px solid var(--line)}.list li:first-child{border-top:0}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin:24px 0 8px}

/* --- kaart --- */
svg.map{width:100%;height:100%;display:block;background:var(--sea);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.map:active{cursor:grabbing}
svg.map *{vector-effect:non-scaling-stroke}
.ctry{fill:var(--land);stroke:var(--border);stroke-width:.7}
.ctry.home{fill:var(--home)}
.ctry.it{fill:var(--itemland);cursor:pointer}
@media (hover:hover){.ctry.it:hover{fill:var(--itemhover)}}
.ctry.it.good,.mt.good{fill:var(--okfill)}.ctry.it.bad,.mt.bad{fill:var(--badfill)}.ctry.it.hl,.mt.hl{fill:var(--hlfill)}
.mt{fill:var(--mt);stroke:var(--mtline);stroke-width:1;cursor:pointer}
@media (hover:hover){.mt:hover{fill:var(--itemhover)}}
.ln{fill:none;stroke:var(--river);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ln.road{stroke:var(--road);stroke-width:2.6}
.hitl,.hitp{fill:none;stroke:transparent;stroke-linecap:round;pointer-events:stroke;cursor:pointer}
.hitl{stroke-width:16}.hitp{stroke-width:26}
.dot{fill:none;stroke:var(--dot);stroke-width:9;stroke-linecap:round;pointer-events:none}
.it.good .ln{stroke:var(--ok);stroke-width:5}.it.bad .ln{stroke:var(--bad);stroke-width:5}.it.hl .ln{stroke:var(--hl);stroke-width:5}
.it.good .dot{stroke:var(--ok);stroke-width:14}.it.bad .dot{stroke:var(--bad);stroke-width:14}.it.hl .dot{stroke:var(--hl);stroke-width:14}
.city{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;pointer-events:none}
.sea{fill:var(--sea);stroke:var(--sea);stroke-width:.5}
.sea.it{cursor:pointer}
@media (hover:hover){.sea.it:hover{fill:var(--itemhover)}}
.sea.good{fill:var(--okfill)}.sea.bad{fill:var(--badfill)}.sea.hl{fill:var(--hlfill)}
.ctry.prov{stroke-opacity:.55}
h3.sec{margin:22px 0 8px;font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lab{pointer-events:none}
.lbl{font:600 12px system-ui,sans-serif;fill:var(--text);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle}
.lbl.c{fill:var(--muted);font-weight:500;font-size:11px;text-anchor:start}
.lbl.ans{font-size:15px;font-weight:700}
.ring{fill:none;stroke:var(--hl);stroke-width:3;animation:pulse 1.1s ease-out infinite;transform-box:fill-box}
@keyframes pulse{0%{opacity:1;stroke-width:4}100%{opacity:.15;stroke-width:1}}
@media (max-width:560px){.prompt{font-size:1.05rem}.opts{grid-template-columns:1fr}}
</style>
</head>

const BOX=(lon0,lat0,lon1,lat1)=>({x0:lon0*U,x1:lon1*U,y0:-mercLat(lat1)*U,y1:-mercLat(lat0)*U});

function smooth(pts,k=1,closed=false){
  const P=pts.map(p=>PX(p[0],p[1])), n=P.length;
  const g=i=>closed?P[(i+n)%n]:P[Math.max(0,Math.min(n-1,i))];
  const f=v=>v.toFixed(1);
  let d=`M${f(P[0][0])} ${f(P[0][1])}`;
  for(let i=0;i<(closed?n:n-1);i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${f(p1[0]+(p2[0]-p0[0])*k/6)} ${f(p1[1]+(p2[1]-p0[1])*k/6)} ${f(p2[0]-(p3[0]-p1[0])*k/6)} ${f(p2[1]-(p3[1]-p1[1])*k/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return closed?d+"z":d;
}

const NS="http://www.w3.org/2000/svg";
const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function svgEl(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

let store={stats:{},best:{}};
try{const s=JSON.parse(localStorage.getItem("kaartquiz-v1"));if(s&&s.stats)store=s;}catch(e){}
const save=()=>{try{localStorage.setItem("kaartquiz-v1",JSON.stringify(store));}catch(e){}};
const stat=(cat,id)=>(store.stats[cat.id]||={})[id]||={c:0,w:0};
const learned=s=>s.c>=2&&s.c>s.w;
const progress=cat=>{const s=store.stats[cat.id]||{};return cat.items.filter(i=>s[i.id]&&learned(s[i.id])).length;};

/* ------------------------------------------------------------------ KAART */
function buildMap(host,cat){
  host.innerHTML="";
  const svg=svgEl("svg",{class:"map"});host.appendChild(svg);
  const gW=svgEl("g",{},svg), gL=svgEl("g",{class:"lab"},svg);
  const S={svg,gW,gL,tx:0,ty:0,s:1,items:{},labels:[],cat,onTap:null,onHover:null,cur:null};
  const byId={};cat.items.forEach(i=>byId[i.id]=i);

  const add=(it,el)=>{(S.items[it.id]||(S.items[it.id]={els:[]})).els.push(el);};
  /* achtergrond: zeeën en oceanen */
  if(cat.kind==="sea"){
    for(const z of D.seas){
      const p=svgEl("path",{d:z.d,class:"sea","data-n":z.n},gW);
      if(z.k&&byId[z.k]){p.setAttribute("data-id",z.k);p.classList.add("it");add(byId[z.k],p);}
    }
  }
  /* achtergrond: landen */
  for(const c of D.countries){
    if(cat.view==="be"&&c.a==="BEL")continue;
    const p=svgEl("path",{d:c.d,class:"ctry","data-n":c.n},gW);
    const id=c.a==="CYN"&&byId.CYP?"CYP":c.a;
    if(cat.kind==="country"&&byId[id]){p.setAttribute("data-id",id);p.classList.add("it");add(byId[id],p);}
    const gid=cat.kind==="group"?c[cat.gkey]:null;
    if(gid&&byId[gid]){p.setAttribute("data-id",gid);p.classList.add("it");add(byId[gid],p);}
  }
  /* achtergrond: Belgische provincies */
  if(cat.view==="be"){
    for(const pv of D.prov){
      const p=svgEl("path",{d:pv.d,class:"ctry prov home","data-n":PNAME[pv.id]},gW);
      const id=cat.kind==="province"?pv.id:cat.kind==="gewest"?pv.r:null;
      if(id&&byId[id]){p.setAttribute("data-id",id);p.classList.add("it");add(byId[id],p);}
    }
  }
  /* items */
  if(cat.kind==="region"){
    for(const it of cat.items){const p=svgEl("path",{d:it.d,class:"mt","data-id":it.id},gW);add(it,p);}
  }else if(cat.kind==="line"){
    const order=cat.items.map(it=>{const w=svgEl("path",{d:it.d});gW.appendChild(w);const b=w.getBBox();gW.removeChild(w);return [it,b.width+b.height];}).sort((a,b)=>b[1]-a[1]);
    for(const [it] of order){
      const g=svgEl("g",{class:"it","data-id":it.id},gW);
      svgEl("path",{d:it.d,class:"ln"+(cat.road?" road":"")},g);
      svgEl("path",{d:it.d,class:"hitl"},g);
      add(it,g);
    }
  }else if(cat.kind==="point"){
    for(const it of cat.items){
      const g=svgEl("g",{class:"it","data-id":it.id},gW);const d=`M${it.pos[0]} ${it.pos[1]}h0`;
      svgEl("path",{d,class:"dot"},g);svgEl("path",{d,class:"hitp"},g);add(it,g);
    }
  }
  if(cat.kind==="country"){ /* micro-staten: extra stip om aan te klikken */
    for(const it of cat.items)if(it.micro){
      const g=svgEl("g",{class:"it pt","data-id":it.id},gW);const d=`M${it.micro[0]} ${it.micro[1]}h0`;
      svgEl("path",{d,class:"dot"},g);svgEl("path",{d,class:"hitp"},g);add(it,g);
    }
  }
  /* steden voor oriëntatie */
  const cityLabels=[];
  if(cat.view==="be"&&!cat.noCities){
    for(const c of BE_CITIES){
      const [x,y]=PX(c[1],c[2]);
      svgEl("path",{d:`M${x} ${y}h0`,class:"city"},gW);
      const t=svgEl("text",{class:"lbl c"},gL);t.textContent=c[0];
      cityLabels.push({t,x,y,dx:7,dy:4,lv:c[3]});
    }
  }
  S.cityLabels=cityLabels;

  /* zoom-knoppen */
  const z=document.createElement("div");z.className="zoom";
  z.innerHTML='<button data-z="in" aria-label="Inzoomen">+</button><button data-z="out" aria-label="Uitzoomen">−</button><button data-z="home" aria-label="Terug naar begin">⌂</button>';
  host.appendChild(z);
  z.onclick=e=>{const b=e.target.closest("button");if(!b)return;const W=svg.clientWidth,H=svg.clientHeight;
    if(b.dataset.z==="home")S.flyTo(S.home);else S.zoomAt(W/2,H/2,b.dataset.z==="in"?1.6:1/1.6,true);};

  /* view-berekeningen */
  S.fitBox=(b,pad=.04)=>{const W=svg.clientWidth||600,H=svg.clientHeight||400,w=Math.max(b.x1-b.x0,1),h=Math.max(b.y1-b.y0,1);
    const s=Math.min(W/(w*(1+2*pad)),H/(h*(1+2*pad)));return{s,tx:W/2-(b.x0+b.x1)/2*s,ty:H/2-(b.y0+b.y1)/2*s};};
  S.apply=()=>{gW.setAttribute("transform",`translate(${S.tx} ${S.ty}) scale(${S.s})`);S.place();};
  S.place=()=>{
    for(const l of S.labels){const px=l.x*S.s+S.tx,py=l.y*S.s+S.ty;
      if(l.isRing){l.t.setAttribute("cx",px);l.t.setAttribute("cy",py);}else{l.t.setAttribute("x",px+(l.dx||0));l.t.setAttribute("y",py+(l.dy||0));}}
    for(const l of S.cityLabels){const on=l.lv===1||S.s>=S.home.s*1.7;l.t.style.display=on?"":"none";
      l.t.setAttribute("x",l.x*S.s+S.tx+l.dx);l.t.setAttribute("y",l.y*S.s+S.ty+l.dy);}
  };
  S.set=v=>{S.tx=v.tx;S.ty=v.ty;S.s=v.s;S.apply();};
  let anim=0;
  S.flyTo=(v,ms=450)=>{cancelAnimationFrame(anim);const a={tx:S.tx,ty:S.ty,s:S.s},t0=performance.now();
    const step=t=>{let k=Math.min(1,(t-t0)/ms);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const ls=Math.log(a.s)+(Math.log(v.s)-Math.log(a.s))*k;const s=Math.exp(ls);
      /* houd het middelpunt vloeiend: interpoleer het kaartpunt in het midden */
      const W=svg.clientWidth,H=svg.clientHeight;const cx0=(W/2-a.tx)/a.s,cy0=(H/2-a.ty)/a.s,cx1=(W/2-v.tx)/v.s,cy1=(H/2-v.ty)/v.s;
      const cx=cx0+(cx1-cx0)*k,cy=cy0+(cy1-cy0)*k;S.tx=W/2-cx*s;S.ty=H/2-cy*s;S.s=s;S.apply();
      if(k<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);};
  S.zoomAt=(mx,my,f,animate)=>{const ns=Math.max(S.minS,Math.min(S.maxS,S.s*f));const r=ns/S.s;
    const v={s:ns,tx:mx-(mx-S.tx)*r,ty:my-(my-S.ty)*r};animate?S.flyTo(v,250):S.set(v);};
  S.bbox=id=>{const it=S.items[id];if(!it)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const e of it.els){const b=e.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
    return{x0,y0,x1,y1};};
  S.focus=(id,fly=true)=>{const b=S.bbox(id);if(!b)return;
    const w=Math.max(b.x1-b.x0,420),h=Math.max(b.y1-b.y0,300),cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;
    const v=S.fitBox({x0:cx-w/2,x1:cx+w/2,y0:cy-h/2,y1:cy+h/2},.25);
    if(v.s<S.home.s){v.s=S.home.s;v.tx=svg.clientWidth/2-cx*v.s;v.ty=svg.clientHeight/2-cy*v.s;}
    fly?S.flyTo(v):S.set(v);};
  S.state=(id,cls)=>{const it=S.items[id];if(!it)return;for(const e of it.els)e.classList.add(cls);};
  S.clear=()=>{for(const k in S.items)for(const e of S.items[k].els)e.classList.remove("good","bad","hl");
    S.labels.forEach(l=>l.t.remove());S.labels=[];};
  S.anchor=id=>{const it=S.items[id];if(!it)return null;const ln=it.els[0].querySelector&&it.els[0].querySelector(".ln");
    if(ln){const p=ln.getPointAtLength(ln.getTotalLength()/2);return[p.x,p.y];}
    const bb=S.bbox(id);return[(bb.x0+bb.x1)/2,(bb.y0+bb.y1)/2];};
  S.label=(id,text,cls="ans")=>{const a=S.anchor(id);if(!a)return;const t=svgEl("text",{class:"lbl "+cls},gL);t.textContent=text;
    const l={t,x:a[0],y:a[1],dy:-12};S.labels.push(l);S.place();return l;};
  S.ring=id=>{const a=S.anchor(id);if(!a)return;const t=svgEl("circle",{class:"ring",r:20},gL);
    S.labels.push({t,x:a[0],y:a[1],isRing:true});S.place();};
  S.labelAt=(e,text)=>{const r=svg.getBoundingClientRect();const t=svgEl("text",{class:"lbl ans"},gL);t.textContent=text;
    S.labels.push({t,x:(e.clientX-r.left-S.tx)/S.s,y:(e.clientY-r.top-S.ty)/S.s,dy:-12});S.place();};
  S.visible=id=>{const b=S.bbox(id);if(!b)return true;const W=svg.clientWidth,H=svg.clientHeight,x=(b.x0+b.x1)/2*S.s+S.tx,y=(b.y0+b.y1)/2*S.s+S.ty;return x>0&&y>0&&x<W&&y<H;};

  /* pan / zoom / tap */
  const ptrs=new Map();let moved=0,pinch=0;
  svg.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);if(ptrs.size===1)moved=0;
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);moved=99;}});
  svg.addEventListener("pointermove",e=>{
    const p=ptrs.get(e.pointerId);
    if(!p){if(e.pointerType==="mouse"&&S.onHover)S.onHover(document.elementFromPoint(e.clientX,e.clientY),e);return;}
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){cancelAnimationFrame(anim);S.tx+=dx;S.ty+=dy;S.apply();}}
    else if(ptrs.size===2){const o=[...ptrs.entries()].find(([k])=>k!==e.pointerId)[1];
      p.x=e.clientX;p.y=e.clientY;const d=Math.hypot(p.x-o.x,p.y-o.y);if(pinch){const r=svg.getBoundingClientRect();
        S.zoomAt((p.x+o.x)/2-r.left,(p.y+o.y)/2-r.top,d/pinch,false);}pinch=d;return;}
    p.x=e.clientX;p.y=e.clientY;});
  const up=e=>{const had=ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;
    if(had&&e.type==="pointerup"&&moved<=8&&ptrs.size===0&&S.onTap)S.onTap(document.elementFromPoint(e.clientX,e.clientY),e);};
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
  svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();cancelAnimationFrame(anim);
    S.zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015),false);},{passive:false});

  /* beginweergave */
  const start=()=>{S.home=S.fitBox(VIEWS[cat.view]);S.minS=S.home.s*.7;S.maxS=(svg.clientWidth||600)/60;S.set(S.home);};
  requestAnimationFrame(start);S.home=S.fitBox(VIEWS[cat.view]);S.minS=S.home.s*.7;S.maxS=(svg.clientWidth||600)/60;S.set(S.home);
  new ResizeObserver(()=>{const wasHome=Math.abs(S.s-S.home.s)<1e-9;const c=S.fitBox(VIEWS[cat.view]);S.home=c;S.minS=c.s*.7;S.maxS=svg.clientWidth/60;if(wasHome)S.set(c);else S.place();}).observe(host);
  return S;
}

/* wat zit er onder de muis / vinger? */
function idOf(el){const g=el&&el.closest&&el.closest("[data-id]");return g?g.getAttribute("data-id"):null;}
function nameOfBg(el){const c=el&&el.closest&&el.closest("[data-n]");return c?c.getAttribute("data-n"):null;}

/* ------------------------------------------------------------------ SCHERMEN */
let cfg={mode:"point",count:10,focus:false};
let run=null,M=null;
const setPlaying=on=>$app.classList.toggle("playing",on);

function home(){
  run=null;M=null;setPlaying(false);
  const card=(c,i)=>{const p=progress(c),n=c.items.length,b=store.best[c.id];
    return `<button class="card cat" data-i="${i}"><span class="ico">${c.icon}</span><b>${esc(c.title)}</b><small>${esc(c.sub)} · ${n} items</small>
      <div class="bar"><i style="width:${p/n*100}%"></i></div><div class="meta">${p}/${n} geleerd${b!=null?` · beste score ${b}%`:""}</div></button>`;};
  const groups=[...new Set(CATS.map(c=>c.group))];
  $app.innerHTML=`
    <h1>🗺️ Kaartquiz Aardrijkskunde</h1>
    <p class="sub">Je krijgt een naam en wijst hem aan op de kaart. Kies een onderwerp. Je voortgang wordt op dit apparaat bewaard.</p>
    ${groups.map(g=>`<h3 class="sec">${esc(g)}</h3><div class="grid">${CATS.map((c,i)=>c.group===g?card(c,i):"").join("")}</div>`).join("")}
    <footer>Belgische rivieren en snelwegen zijn schematisch getekend; de rest komt uit Natural Earth.<br><button class="btn ghost" id="reset">Voortgang wissen</button></footer>`;
  $app.querySelectorAll(".cat").forEach(b=>b.onclick=()=>setup(CATS[+b.dataset.i]));
  document.getElementById("reset").onclick=()=>{if(confirm("Alle voortgang wissen?")){store={stats:{},best:{}};save();home();}};
}

function setup(cat){
  run=null;setPlaying(false);
  const total=cat.items.length,cur={mode:(cat.noPoint&&cfg.mode==="point")?"name":cfg.mode,count:Math.min(cfg.count,total),focus:cfg.focus?1:0};
  const counts=[10,20].filter(n=>n<total).concat([total]);
  if(!counts.includes(cur.count))cur.count=counts[0];
  $app.innerHTML=`
    <div class="top"><button class="btn ghost" id="back">← Terug</button></div>
    <h1>${cat.icon} ${esc(cat.title)}</h1><p class="sub">${esc(cat.sub)}</p>
    <div class="card">
      <div class="label">Oefenvorm</div>
      <div class="seg" data-k="mode">
        ${cat.noPoint?"":'<button data-v="point">Aanwijzen (naam → kaart)</button>'}<button data-v="name">Benoemen (meerkeuze)</button>
        <button data-v="type">Benoemen (intypen)</button><button data-v="explore">Verkennen</button>
      </div>
      <div class="label">Aantal vragen</div>
      <div class="seg" data-k="count">${counts.map(n=>`<button data-v="${n}">${n===total?`Alles (${n})`:n}</button>`).join("")}</div>
      <div class="label">Slim oefenen</div>
      <div class="seg" data-k="focus"><button data-v="0">Willekeurig</button><button data-v="1">Zwakke punten eerst</button></div>
      <button class="btn primary" id="go">Start</button>
    </div>`;
  const sync=()=>$app.querySelectorAll(".seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(cur[g.dataset.k])===b.dataset.v)));
  $app.querySelectorAll(".seg").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    cur[g.dataset.k]=g.dataset.k==="mode"?b.dataset.v:+b.dataset.v;sync();});
  sync();
  document.getElementById("back").onclick=home;
  document.getElementById("go").onclick=()=>{cfg={mode:cur.mode,count:cur.count,focus:!!cur.focus};start(cat);};
}

function start(cat){
  let ids=cat.items.slice();
  ids=cfg.focus?ids.map(i=>{const s=stat(cat,i.id);return[i,Math.random()*(1+Math.max(0,s.c-s.w)*2)];}).sort((a,b)=>a[1]-b[1]).map(x=>x[0]):shuffle(ids);
  run={cat,qs:ids.slice(0,cfg.count),n:0,score:0,wrong:[],locked:false};
  screen(cat);
  cfg.mode==="explore"?explore():ask();
}

function screen(cat){
  setPlaying(true);
  $app.innerHTML=`
    <div class="top"><button class="btn ghost" id="quit">✕ Stop</button><span class="meta" id="prog"></span></div>
    <div class="prompt" id="pr"></div>
    <div class="mapwrap" id="mw"></div>
    <div class="bottom" id="bt"></div>`;
  document.getElementById("quit").onclick=()=>{if(cfg.mode==="explore"||confirm("Quiz stoppen?"))home();};
  M=buildMap(document.getElementById("mw"),cat);
}

/* -- verkennen -- */
function explore(){
  const cat=run.cat;
  document.getElementById("prog").textContent="Verkennen";
  document.getElementById("pr").innerHTML=`<small>${esc(cat.title)}</small>Tik op de kaart om namen te zien`;
  document.getElementById("bt").innerHTML=`<div class="hint">Sleep om te verschuiven, knijp of scroll om te zoomen.</div>`;
  const show=(el,e)=>{M.clear();const id=idOf(el);
    if(id){const it=cat.items.find(i=>i.id===id);M.state(id,"hl");M.label(id,it.name);}
    else{const n=nameOfBg(el);if(n)M.labelAt(e,n);}};
  M.onTap=show;M.onHover=(el,e)=>{const k=idOf(el)||nameOfBg(el);if(k!==M.cur){M.cur=k;show(el,e);}};
}

/* -- vraag stellen -- */
const ansOf=it=>it.ans??it.name, altOf=it=>it.ansAlt??it.alt;
function ask(){
  const {cat,qs,n}=run;
  if(n>=qs.length)return results();
  const it=qs[n];run.locked=false;
  M.clear();
  document.getElementById("prog").textContent=`Vraag ${n+1} / ${qs.length} · ${run.score} goed`;
  const bt=document.getElementById("bt"),pr=document.getElementById("pr");
  if(cfg.mode==="point"){
    pr.innerHTML=`<small>Wijs ${esc(cat.noun)} aan</small>${esc(it.name)}`;
    bt.innerHTML=`<div id="qa"><div class="hint">Tik op de juiste plek op de kaart.</div></div><div id="fbx"></div>`;
    M.onTap=el=>{if(run.locked)return;const id=idOf(el);answer(id===it.id,id,el);};
    M.onHover=null;
  }else{
    M.onTap=null;M.onHover=null;
    pr.innerHTML=cat.askName?`<small>${esc(cat.askName)}</small>${esc(it.name)}`:`<small>Hoe heet ${esc(cat.noun)} dat oplicht?</small>&nbsp;`;
    M.state(it.id,"hl");M.ring(it.id);
    if(!M.visible(it.id))M.flyTo(M.home,350);
    if(cfg.mode==="name"){
      const others=[...new Set(cat.items.filter(x=>ansOf(x)!==ansOf(it)).map(ansOf))];
      const opts=shuffle([ansOf(it),...shuffle(others).slice(0,3)]);
      bt.innerHTML=`<div id="qa"><div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div><div id="fbx"></div>`;
      bt.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(run.locked)return;answer(b.dataset.v===ansOf(it),null,null,b);});
    }else{
      bt.innerHTML=`<div id="qa"><div class="row"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ het antwoord…"><button class="btn primary" id="ok">Controleer</button><button class="btn ghost" id="skip">Weet ik niet</button></div></div><div id="fbx"></div>`;
      const inp=document.getElementById("ans");inp.focus();
      const check=()=>{if(run.locked)return;const g=norm(inp.value);if(!g)return;
        const good=[ansOf(it),...altOf(it)].map(norm);let ok=good.includes(g),close=false;
        if(!ok&&g.length>4&&good.some(t=>lev(t,g)<=1)){ok=true;close=true;}
        inp.disabled=true;answer(ok,null,null,null,inp.value,close);};
      document.getElementById("ok").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check();};
      document.getElementById("skip").onclick=()=>{if(run.locked)return;inp.disabled=true;answer(false,null,null,null,"");};
    }
  }
}

function answer(ok,pickedId,el,btn,given,close){
  const {cat,qs,n}=run,it=qs[n];run.locked=true;
  const st=stat(cat,it.id);
  if(ok){st.c++;run.score++;}else{st.w++;run.wrong.push(it);}
  save();
  M.clear();
  if(!ok&&pickedId&&M.items[pickedId])M.state(pickedId,"bad");
  M.state(it.id,ok?"good":"hl");
  M.label(it.id,it.name);
  const right=ansOf(it);
  let who="";
  if(cfg.mode==="point"&&!ok){
    const o=pickedId?cat.items.find(x=>x.id===pickedId):null;
    const nm=o?o.name:nameOfBg(el);
    who=nm?`Je klikte op: <b>${esc(nm)}</b>.`:"Je klikte ernaast.";
  }
  if(btn){document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===right)b.classList.add("ok");});if(!ok)btn.classList.add("bad");}
  if(cfg.mode==="point"&&!ok)M.focus(it.id,true);
  const last=n+1>=qs.length;
  const msg=ok?(close?`Bijna goed – geteld als goed! Juist: <b>${esc(right)}</b>`:"Goed!"):`${who} ${cfg.mode==="point"?"Het juiste antwoord is gemarkeerd":"Het juiste antwoord is"}: <b>${esc(right)}</b>`;
  const fb=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓":"✗"}</b> ${msg}${it.info?`<small>${esc(it.info)}</small>`:""}</div>
    <div class="row"><button class="btn primary" id="next">${last?"Resultaat":"Volgende"} ↵</button></div>`;
  if(cfg.mode==="point")document.getElementById("qa").innerHTML="";
  document.getElementById("fbx").innerHTML=fb;
  document.getElementById("next").onclick=go;
  function go(){run.n++;if(cfg.mode==="point"&&!ok)M.flyTo(M.home,350);ask();}
  run.next=go;
  if(ok&&cfg.mode==="point"){const R=run;setTimeout(()=>{if(run===R&&R.next===go&&R.locked&&document.getElementById("next"))go();},900);}
}

/* -- resultaat -- */
function results(){
  const {cat,qs,score,wrong}=run;setPlaying(false);M=null;
  const pct=Math.round(score/qs.length*100);
  store.best[cat.id]=Math.max(store.best[cat.id]||0,pct);save();
  const msg=pct===100?"Perfect! 🏆":pct>=80?"Sterk gedaan! 👏":pct>=60?"Goed bezig 👍":"Blijf oefenen 💪";
  $app.innerHTML=`
    <div class="card center"><div class="score">${pct}%</div><h2>${msg}</h2><p class="sub">${score} van ${qs.length} goed</p>
      <div class="row" style="justify-content:center">${wrong.length?`<button class="btn primary" id="redo">Fouten oefenen (${wrong.length})</button>`:""}
      <button class="btn" id="again">Opnieuw</button><button class="btn" id="menu">Menu</button></div></div>
    ${wrong.length?`<div class="card" style="margin-top:12px"><h2>Om te onthouden</h2><ul class="list">${wrong.map(w=>`<li><b>${esc(w.name)}</b>${w.info?`<br><span class="meta">${esc(w.info)}</span>`:""}</li>`).join("")}</ul></div>`:""}`;
  document.getElementById("again").onclick=()=>start(cat);
  document.getElementById("menu").onclick=home;
  const r=document.getElementById("redo");
  if(r)r.onclick=()=>{run={cat,qs:shuffle(wrong),n:0,score:0,wrong:[],locked:false};screen(cat);ask();};
}

document.addEventListener("keydown",e=>{
  if(!run||e.key!=="Enter"||e.repeat||e.target.tagName==="INPUT")return;
  const b=document.getElementById("next");if(b&&run.locked&&document.activeElement!==b)b.click();
});

home();
</script>
</body>
